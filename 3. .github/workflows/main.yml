yaml
name: Auditoria de Rendimiento Waiky
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
      - if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ://gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Alerta de Rendimiento: Artesania a Mano Waiky"
          to: loswaikys@gmail.com
          from: "Monitor Waiky <loswaikys@gmail.com>"
          body: "Se detecto una caida en el rendimiento de https://blogspot.com"
